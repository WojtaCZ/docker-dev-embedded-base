name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [base-image-updated]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This image is ~11 GB, and `load: true` stores it twice: once in the
      # BuildKit cache and again in the Docker daemon. That does not fit beside
      # the SDKs a hosted runner ships with, and the build dies with "no space
      # left on device" while importing. None of these are used here.
      - name: Free up runner disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint shell and JSON assets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning run-profile-task.sh scripts/*.sh dev-doctor-checks/*.sh tests/*.sh
          for f in profile.schema.json \
                   vscode-templates/tasks.json \
                   vscode-templates/launch.json \
                   claude-embedded-base/settings.layer.json; do
            jq -e . "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
          echo "shell + JSON assets OK"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first — nothing is published unless the smoke tests pass.
      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dev-embedded-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -e DEV_SKIP_UPDATE=1 \
            -v "$PWD/tests:/tests:ro" \
            dev-embedded-base:ci bash /tests/smoke.sh

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell the parent that its image is verified downstream, so :stable can move.
      - name: Report upstream
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          gh api repos/WojtaCZ/docker-dev-template/dispatches \
             -f event_type=downstream-verified

      # The image is already published by this point, so a failed fan-out must
      # not fail the run: it means leaf images rebuild late, not that this one
      # is bad. Each dispatch is independent and warns for itself.
      - name: Notify leaf images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          for repo in docker-dev-embedded-arm docker-dev-embedded-wch; do
            if gh api "repos/WojtaCZ/$repo/dispatches" -f event_type=base-image-updated >/dev/null; then
              echo "dispatched base-image-updated -> $repo"
            else
              echo "::warning::could not dispatch to $repo -- DOWNSTREAM_DISPATCH_PAT may lack access to it"
            fi
          done

  # Shared assets in this repo are the source of truth for the copies carried by
  # docker-dev-embedded-telink. Warn when they drift.
  asset-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: base
      # The sibling repo is private and the repo-scoped GITHUB_TOKEN cannot see
      # it, so this checkout 404s unless DOWNSTREAM_DISPATCH_PAT is available.
      # Report that as a skip rather than a red annotation on every run.
      - id: telink
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: WojtaCZ/docker-dev-embedded-telink
          path: docker-dev-embedded-telink
          token: ${{ secrets.DOWNSTREAM_DISPATCH_PAT || github.token }}
      - name: Check shared assets are in sync
        if: steps.telink.outcome == 'success'
        run: |
          mv base docker-dev-embedded-base
          ./docker-dev-embedded-base/scripts/sync-shared-assets.sh --check \
            "$PWD/docker-dev-embedded-telink"
      - name: Drift check skipped
        if: steps.telink.outcome != 'success'
        run: |
          echo "::notice::docker-dev-embedded-telink is not reachable from this workflow; shared-asset drift check skipped."

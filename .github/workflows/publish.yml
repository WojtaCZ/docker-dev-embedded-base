name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [base-image-updated]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint shell and JSON assets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning run-profile-task.sh scripts/*.sh dev-doctor-checks/*.sh tests/*.sh
          for f in profile.schema.json \
                   vscode-templates/tasks.json \
                   vscode-templates/launch.json \
                   claude-embedded-base/settings.layer.json; do
            jq -e . "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
          echo "shell + JSON assets OK"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first — nothing is published unless the smoke tests pass.
      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: dev-embedded-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -e DEV_SKIP_UPDATE=1 \
            -v "$PWD/tests:/tests:ro" \
            dev-embedded-base:ci bash /tests/smoke.sh

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell the parent that its image is verified downstream, so :stable can move.
      - name: Report upstream
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          gh api repos/WojtaCZ/docker-dev-template/dispatches \
             -f event_type=downstream-verified

      # Fan out to leaf images so they rebuild against the fresh base layer.
      - name: Notify leaf images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          gh api repos/WojtaCZ/docker-dev-embedded-arm/dispatches \
             -f event_type=base-image-updated
          gh api repos/WojtaCZ/docker-dev-embedded-wch/dispatches \
             -f event_type=base-image-updated

  # Shared assets in this repo are the source of truth for the copies carried by
  # docker-dev-embedded-telink. Warn when they drift.
  asset-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: base
      - uses: actions/checkout@v4
        with:
          repository: WojtaCZ/docker-dev-embedded-telink
          path: docker-dev-embedded-telink
      - name: Check shared assets are in sync
        run: |
          mv base docker-dev-embedded-base
          ./docker-dev-embedded-base/scripts/sync-shared-assets.sh --check \
            "$PWD/docker-dev-embedded-telink"
